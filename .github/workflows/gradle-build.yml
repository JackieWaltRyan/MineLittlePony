name: Build Mod

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-1.12.2-${{ hashFiles('build.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Setup decomp workspace
        run: ./gradlew setupDecompWorkspace --no-daemon --stacktrace

      - name: Build shadowJar
        run: ./gradlew shadowJar --no-daemon --stacktrace

      - name: Upload built mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineLittlePony-build
          path: build/libs/*
          if-no-files-found: error
